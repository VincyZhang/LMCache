# XPU multiprocess tests (single pod / 1 Intel GPU per step).
# This suite reuses the multiprocess scripts through an XPU wrapper.

x-flaky-retry: &flaky-retry
  automatic:
    - exit_status: -1
      limit: 2
    - exit_status: "*"
      limit: 2

x-pod-1xpu: &pod-1xpu
  containers:
    - name: container-0
      image: public.ecr.aws/q9t5s3a7/vllm-ci-test-repo:ee0da84ab9e04ac7610e28580af62c365e898389-xpu
      imagePullPolicy: IfNotPresent
      resources:
        requests:
          deviceclass.resource.kubernetes.io/gpu.intel.com: "1"
        limits:
          deviceclass.resource.kubernetes.io/gpu.intel.com: "1"
      volumeMounts:
        - { name: hf-cache, mountPath: /root/.cache/huggingface }
        - { name: dshm, mountPath: /dev/shm }
  volumes:
    - { name: hf-cache, hostPath: { path: /data/huggingface, type: DirectoryOrCreate } }
    - { name: dshm, emptyDir: { medium: Memory, sizeLimit: 16Gi } }

steps:
  - group: ":intel-xpu: Multiprocess (1-pod)"
    steps:
      - label: ":intel-xpu: lm_eval_engine_driven"
        command: |
          export LMCACHE_MP_TRANSFER_MODE="engine_driven"
          export L1_USE_LAZY="false"
          export CPU_BUFFER_SIZE="80"
          .buildkite/k3_tests/xpu/multiprocess/run.sh lm_eval
        timeout_in_minutes: 45
        retry: *flaky-retry
        agents: { queue: "intel-xpu" }
        plugins: [{ kubernetes: { podSpec: *pod-1xpu } }]
        artifact_paths: ["*.log"]

      - label: ":intel-xpu: cache_stats"
        command: .buildkite/k3_tests/xpu/multiprocess/run.sh cache_stats
        timeout_in_minutes: 45
        agents: { queue: "intel-xpu" }
        plugins: [{ kubernetes: { podSpec: *pod-1xpu } }]
        artifact_paths: ["*.log"]

      - label: ":intel-xpu: http_api"
        command: .buildkite/k3_tests/xpu/multiprocess/run.sh http_api
        timeout_in_minutes: 45
        agents: { queue: "intel-xpu" }
        plugins: [{ kubernetes: { podSpec: *pod-1xpu } }]
        artifact_paths: ["*.log"]

      - label: ":intel-xpu: fault_tolerance"
        command: .buildkite/k3_tests/xpu/multiprocess/run.sh fault_tolerance
        timeout_in_minutes: 45
        retry: *flaky-retry
        agents: { queue: "intel-xpu" }
        plugins: [{ kubernetes: { podSpec: *pod-1xpu } }]
        artifact_paths: ["*.log"]

      - label: ":intel-xpu: restart_recovery"
        command: .buildkite/k3_tests/xpu/multiprocess/run.sh restart_recovery
        timeout_in_minutes: 45
        retry: *flaky-retry
        agents: { queue: "intel-xpu" }
        plugins: [{ kubernetes: { podSpec: *pod-1xpu } }]
        artifact_paths: ["*.log"]
