# Backward-compatible entrypoint for the XPU unit-tests pipeline.
# Existing Buildkite webhooks/jobs that point at this file keep working.
agents:
  queue: "intel-xpu"

env:
  HF_TOKEN: ""  # set your HuggingFace token here (needed for gated model access)

steps:
  - label: ":pipeline: Upload XPU unit-tests pipeline"
    command: bash .buildkite/k3_tests/common_scripts/upload-pipeline.sh .buildkite/k3_tests/xpu/unittests/pipeline.yml
